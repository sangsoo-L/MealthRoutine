# 수동 CD: 버튼을 누르고(배포할 커밋 SHA 입력) 팀장이 승인해야만 운영 서버에 배포된다(DEPLOY-7).
# push·머지만으로는 배포되지 않는다. 운영 절차는 deploy/README.md를 본다.
name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 배포할 커밋 SHA (develop 또는 main에 있는 커밋, 7~40자)
        required: true
        type: string

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지 않는다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: 배포할 커밋 확인
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      short: ${{ steps.r.outputs.short }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: r
        name: SHA 형식·브랜치 확인
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then echo "SHA 형식이 아닙니다: $INPUT_SHA"; exit 1; fi
          SHA="$(git rev-parse --verify "${INPUT_SHA}^{commit}")"
          if git merge-base --is-ancestor "$SHA" origin/develop || git merge-base --is-ancestor "$SHA" origin/main; then
            echo "배포 대상: $SHA"
          else
            echo "develop·main에 없는 커밋은 배포하지 않습니다: $SHA"; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

  test:
    name: 배포 전 검사
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    name: 빌드·서버 반영
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # production 환경의 Required reviewers(팀장)가 승인해야 이 작업이 시작된다.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      # 서버 릴리스 폴더 이름: 실행마다 새 이름이라 운영 중인 폴더를 덮어쓰지 않는다(CICD-R1).
      RELEASE: ${{ needs.resolve.outputs.short }}-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 백엔드 jar
        working-directory: backend
        run: sh ./gradlew --no-daemon bootJar

      - name: 프론트 빌드
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run verify:dist

      - name: 릴리스 묶기
        run: |
          mkdir -p "release/$RELEASE"
          JAR="$(ls backend/build/libs/*.jar | grep -v -- '-plain\.jar$' | head -n1)"
          cp "$JAR" "release/$RELEASE/app.jar"
          cp -R frontend/dist "release/$RELEASE/dist"
          echo "$SHA" > "release/$RELEASE/COMMIT"
          tar -C release -czf release.tgz "$RELEASE"
          ls -la "release/$RELEASE"

      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 새 폴더 releases/<RELEASE>에 풀고(이미 있으면 덮어쓰지 않고 중단) release.sh로 전환한다.
      # release.sh는 재시작 명령 실패·내부 점검 실패 모두 직전 버전으로 자동 복귀하고 실패(1·3·4)로 끝난다.
      # 전환은 성공했지만 직전 버전 기록 저장에 실패하면 5로 끝난다(앱은 새 버전, 안내대로 기록을 고친다).
      - name: 서버에 올리고 전환
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          OPTS="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes"
          scp $OPTS release.tgz "ubuntu@$HOST:/tmp/release-$RELEASE.tgz"
          ssh $OPTS "ubuntu@$HOST" bash -s -- "$RELEASE" <<'REMOTE'
          set -euo pipefail
          RELEASE="$1"
          cd /opt/mealthroutine/releases
          if [ -e "$RELEASE" ]; then echo "이미 있는 릴리스 폴더라 덮어쓰지 않습니다: $RELEASE" >&2; rm -f "/tmp/release-$RELEASE.tgz"; exit 2; fi
          rm -rf "$RELEASE.tmp"
          mkdir "$RELEASE.tmp"
          tar -xzf "/tmp/release-$RELEASE.tgz" -C "$RELEASE.tmp" --strip-components=1
          rm -f "/tmp/release-$RELEASE.tgz"
          mv "$RELEASE.tmp" "$RELEASE"
          cd /opt/mealthroutine
          ./release.sh activate "$RELEASE"
          REMOTE

      # 외부 점검은 자동 복귀하지 않는다. 서버 안 점검(release.sh)은 이미 통과했으므로, 여기서 실패하면
      # 원인은 보통 새 버전이 아니라 인증서·DNS·보안 그룹 쪽이다. 실패하면 Actions를 실패로 끝내고
      # 사람이 확인해 필요하면 서버에서 ./release.sh rollback 을 실행한다(deploy/README.md 2장).
      - name: 외부 점검(실패 시 수동 판단)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in 1 2 3; do
            if curl -fsS -o /dev/null --max-time 10 "$SITE_URL/" \
              && curl -fsS -o /dev/null --max-time 10 "$SITE_URL/api/v1/exercises"; then
              echo "외부 점검 통과: $SITE_URL ($RELEASE)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::외부 점검 실패: 서버 안 점검은 통과했고 자동 복귀하지 않았습니다. 확인 후 필요하면 서버에서 ./release.sh rollback"
          exit 1

      - name: SSH 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key
