spring:
  application:
    name: backend
  # Gradle runs from backend/, while an IDE may run from the repo root.
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  # Login is JWT only (decision AUTH2-1). Without this, Spring Security would create a default user
  # and print a generated password at startup.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mealthroutine}
    username: ${DB_USERNAME:mealthroutine}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # DB structure is managed by database/*.sql (team rule 6.1); JPA only checks it matches.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
# JWT (decisions JWT-KEY-1~4, LOGIN-1). The key is never written here: JWT_SECRET comes from .env or the
# environment and must be Base64 of 32+ random bytes. A missing or invalid key stops the server at startup.
app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 14d
    pin-ttl: 10m
